name: Update Goodreads shelves
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - books.json
      - CNAME
      - scripts/**
      - tests/**
      - .github/workflows/goodreads.yml
  schedule:
    - cron: '17 */12 * * *'
concurrency:
  group: goodreads-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Goodreads sync safeguards
        run: python -m unittest discover -s tests -v
      - name: Read public Goodreads shelves and challenge
        id: sync
        continue-on-error: true
        run: python scripts/sync.py
      - name: Save updated reading data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Goodreads reading data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      # Publish in this run: GITHUB_TOKEN commits do not trigger a Pages build.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site files
        run: |
          mkdir -p _site
          cp index.html books.json CNAME _site/
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish reading dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report incomplete Goodreads sync
        if: steps.sync.outcome == 'failure'
        run: |
          echo '::error::Some Goodreads sources failed. Cached data was published; inspect the Goodreads sync summary.'
          exit 1
